name = "trmnl-orca-departures"
main = "src/worker.js"
compatibility_date = "2026-06-07"
preview_urls = true

# The `*.workers.dev` subdomain is the sign's only address — the device has no other way to reach us,
# and its captive-portal URL is built from it. Stated explicitly rather than left to the default,
# which is the same value but warns on every deploy that it is being assumed.
workers_dev = true

[observability.logs]
enabled = true

# Deployment config. Nothing here is secret and nothing here is a home address, so it is committed
# — a fork edits this block and redeploys. Secrets go through `wrangler secret put`; the agency and
# stop IDs travel in the device's URL path so they are never written down in the repo at all.
#
# The rule these exist to serve is in CLAUDE.md: no deployment-specific value may be a literal in
# the code. Add to this block rather than reaching for a constant.
#
# `DIRECTION_OVERRIDES` is the one display value that must NOT be added here — it is keyed by stop
# ID, so this sign's entry would be a home address in a committed file. It goes in `.dev.vars` and
# `wrangler secret put` instead. See `.dev.vars.example`.
#
# Everything below is read only through `readConfig()` in `src/config.js`, which coerces and
# range-checks each value. Note the types differ by origin: a number here arrives as a number, while
# the same name set in `.dev.vars` or as a secret arrives as a string.
[vars]
# IANA timezone. Everything the sign displays or schedules is computed in local time.
TIMEZONE = "America/Los_Angeles"

# The active window, local time, 24h. Outside it the sign draws its rest screen and sleeps until the
# next start — one wake, not a slower cadence, and it does not call OneBusAway at all in between.
#
# The sleep is computed fresh each evening rather than assumed, because the device wakes to poll
# rather than on a wall clock, and because a night is 23 or 25 hours twice a year. See
# `src/schedule.js` for what daylight saving does to the naive version of that arithmetic.
ACTIVE_START = "06:30"
ACTIVE_END = "21:30"

# Seconds between polls while the sign is awake. `refresh_rate` is unclamped by the firmware, so the
# overnight sleep is just a large number computed from the window above rather than a setting.
# Absent or 0 hot-loops the device and flattens the battery — never omit it.
#
# There is deliberately no idle rate. Overnight is a single sleep, so a third tier between "awake"
# and "asleep" would have nothing to describe; a fork that wants slower daytime polling changes this
# number rather than adding one.
REFRESH_ACTIVE_SECONDS = 60

# The regional OneBusAway deployment. Only Puget Sound has been tested.
OBA_BASE_URL = "https://api.pugetsound.onebusaway.org/api/where"

# How long an obviously hostile request is held before its 404, in milliseconds. Applied only to
# requests whose path is not even shaped like this sign's URL — a scanner — and to a wrong `/stats`
# password. **Never to a well-shaped path with a bad token**, which is the pairing typo: the device's
# read timeout is 15 s and its first three failed polls draw nothing at all, so delaying that case
# turns one mistyped character into a sign that does nothing for seven minutes with no clue why.
#
# The tradeoff is concurrency — a held request occupies a Worker invocation, so a large enough flood
# could crowd out the device's own poll. Lower this if that ever happens; 0 disables the delay.
TARPIT_MS = 25000

# `CLOUDFLARE_ACCOUNT_ID` is deliberately NOT here, even though it is not a credential.
#
# The stats page needs it to READ its own data: Analytics Engine is written through the binding below
# but read through Cloudflare's SQL HTTP API, which takes the account ID in its URL — there is no
# `env.ANALYTICS.query()`. So the Worker does need it at runtime.
#
# It goes with the secrets anyway, because this block is committed and the repo is public. An account
# ID is not a password, but it identifies whose account this is to anyone reading the repo, and a
# fork needs its own value regardless — so committing one helps nobody and costs a little privacy.
# This is the same fourth category `DIRECTION_OVERRIDES` falls into: not secret, not publishable.
#
#   npx wrangler secret put CLOUDFLARE_ACCOUNT_ID
#
# Until it is set, `/stats` renders an explanatory banner rather than failing. Nothing the device
# does depends on it.

# Must match the `dataset` of the matching binding below. Read through vars rather than hardcoded so
# the queries and the bindings cannot drift apart silently.
ANALYTICS_DATASET = "trmnl_orca_departures_requests"
DEVICE_LOGS_DATASET = "trmnl_orca_departures_device_logs"
DEVICE_TELEMETRY_DATASET = "trmnl_orca_departures_devices"

# Request outcomes, for the `/stats` page. Analytics Engine rather than KV, and the reason is worth
# keeping written down: KV's free write quota is 1000 a day and this sign alone polls roughly 1440
# times a day, so per-request bookkeeping in KV would exhaust the quota on entirely legitimate
# traffic before an attacker existed. Analytics Engine is free at 100k writes and 10k read queries a
# day, and does not touch the KV quota.
#
# Expected volume here is roughly 3-5k data points a day against that 100k limit. There is no quota
# question to answer — stated so nobody re-derives one from a published figure, which has cost this
# project two sessions already.
#
# **Analytics Engine needs one-time enablement in the dashboard** before `wrangler deploy` will
# accept these. Without it the deploy fails with "You need to enable Analytics Engine", error code
# 10089. Enable it at dash.cloudflare.com under Workers, Analytics Engine.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trmnl_orca_departures_requests"

# `/api/log`, the device's own diagnostic channel — the only window into a sign that is rendering
# nothing. Written by `recordDeviceLogs()` in `src/stats/device-logs.js` and read back by the Device
# logs panel on `/stats`.
#
# **This is history, and `console.log` is not a substitute for it.** A live `wrangler tail` only shows
# what happens while someone is watching, and the entries that matter arrive during a failure, which
# is exactly when nobody is. `[observability.logs]` above does retain console output for a few days,
# but in a separate store with a much shorter window that cannot be queried alongside the request
# rows explaining what the device was reacting to. Both are kept, for different jobs.
#
# Kept separate from the requests dataset rather than shared, so high-volume firmware chatter cannot
# dilute the sampling of request outcomes, and so the two can be queried and aged independently.
[[analytics_engine_datasets]]
binding = "DEVICE_LOGS"
dataset = "trmnl_orca_departures_device_logs"

# What the device reports about itself on every wake — MAC address, firmware build, panel geometry,
# battery and WiFi. Written by `recordDeviceTelemetry()` in `src/stats/device-telemetry.js` and read
# back by the Devices panel on `/stats`.
#
# **This is separate because Analytics Engine accepts twenty blobs per row and rejects the whole row
# past that.** These columns were appended to the requests schema on 2026-08-02, took it to
# twenty-eight, and silently stopped every write for a full deploy cycle — no request outcomes, no
# rejections, nothing, with the page still rendering. `assertWithinLimits()` now throws at module
# load so the same mistake fails a `wrangler deploy --dry-run` instead of a day of data.
#
# The split is right on its own terms too: these describe a device rather than a request, and most
# rows in the requests dataset are scanner traffic where every one of them would be empty.
[[analytics_engine_datasets]]
binding = "DEVICE_TELEMETRY"
dataset = "trmnl_orca_departures_devices"

# Required for the bundled font, or the static import fails.
#
# `**/*.wasm` must NOT be listed here. Declaring it as Data overrides wrangler's built-in
# CompiledWasm rule and hands `initWasm()` raw bytes, which makes it call
# `WebAssembly.instantiate(buffer)` — workerd forbids that and throws "Wasm code generation
# disallowed by embedder". Measured 2026-08-01.
#
# Fonts must be TTF, not WOFF: resvg parses raw sfnt and cannot decompress a WOFF container.
# A WOFF loads without error and then renders every layout with no text at all.
#
# `fallthrough` keeps wrangler's built-in Data rule for `**/*.bin` active instead of shadowing it.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true
